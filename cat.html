<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просто кот</title>
    <style>
        /* Базовые стили для центрирования картинки */
        body {
            margin: 0;
            padding: 0;
            height: 100vh; /* Высота на весь экран */
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
        }
        img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 15px; /* Скругленные углы для красоты */
            box-shadow: 0 4px 8px rgba(0,0,0,0.2); /* Легкая тень */
        }
    </style>
</head>
<body>

    <!-- Здесь мы загружаем картинку кота с публичного сервиса-заглушки -->
    <img src="https://cataas.com/cat" alt="Случайный кот">

</body>
</html>
